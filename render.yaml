services:
  - type: web
    name: talent-social-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      # IF_LIVE is sync:false ON PURPOSE. It was previously value:"0" here,
      # which meant every blueprint sync silently reset the dashboard setting
      # back to demo mode - so a push quietly stopped the app making any real
      # requests and every row came back not_found. sync:false makes Render
      # prompt once and then leave the operator's value alone.
      - key: IF_LIVE
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SERPAPI_ENGINE
        value: "google"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "12"
      - key: CACHE_TTL_SECONDS
        value: "900"
      # Secrets: sync:false means Render prompts for them and never stores the
      # value in git. Set every one of these in the dashboard.
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: WIKIMEDIA_CONTACT
        sync: false
      # Render's free tier has an ephemeral filesystem: the SQLite entity store
      # and HTTP cache are wiped on every deploy and on cold start. Fine for
      # evaluation. For the compounding entity store to actually compound,
      # attach a disk (paid) or point these at Postgres.
      - key: IF_DB_PATH
        value: "/tmp/identityforge.db"
      - key: IF_CACHE_PATH
        value: "/tmp/http_cache.db"
